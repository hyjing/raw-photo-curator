[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raw-photo-curator"
version = "0.2.2"
description = "Local-first RAW photo culling and editing-potential analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "rawpy>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "build>=1.2"]
packaging = ["pyinstaller>=6.0"]
vision = ["opencv-python-headless>=4.10,<5", "onnxruntime>=1.20"]

[project.scripts]
raw-curator = "raw_photo_curator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raw_photo_curator"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
